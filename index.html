<body>
  <header class="tab-bar">
    <nav id="areas" aria-label="Research areas"></nav>
    <div class="site-info">
      <a id="offline-download" hidden></a>
      <label class="visually-hidden" for="language" id="language-label">Language</label>
      <select id="language" disabled></select>
      <span id="version"></span>

  <main id="main" aria-busy="true">
    <p id="status" role="status">Loading the technology tree…</p>
    <div id="tree"></div>

  <dialog id="technology-details" aria-labelledby="technology-title">
    <header class="details-header">
      <h1 id="technology-title"></h1>
      <button class="close-details" id="close-details" type="button" autofocus aria-label="Close">×</button>
    </header>
    <div id="technology-content"></div>
  </dialog>
